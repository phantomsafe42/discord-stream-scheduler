<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d0f17">
    <meta name="description" content="Build Discord stream schedules from UTC times.">
    <title>Discord Stream Schedule Builder</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="site-header">
      <div>
        <p class="eyebrow">PRIVATE STREAM TOOL</p>
        <h1>Discord Stream<br> <span>Schedule Builder</span></h1>
      </div>
      <div class="timezone-chip" title="Enter all schedule dates and times in UTC">
        <span class="live-dot" aria-hidden="true"></span>
        UTC
      </div>
    </header>

    <main>
      <section class="panel editor-panel" aria-labelledby="editor-title">
        <div class="section-heading">
          <div>
            <p class="step">01 / BUILD</p>
            <h2 id="editor-title">Tomorrow’s lineup</h2>
          </div>
          <div class="template-actions" aria-label="Template controls">
            <button type="button" class="button quiet" id="save-template">Save template</button>
            <button type="button" class="button quiet" id="load-template">Load template</button>
            <button type="button" class="button danger-quiet" id="clear-schedule">Clear</button>
          </div>
        </div>

        <div class="top-fields">
          <label class="field announcement-field">
            <span>Announcement</span>
            <input id="announcement" maxlength="240" autocomplete="off">
          </label>
          <label class="field date-field">
            <span>Schedule date (UTC)</span>
            <input id="schedule-date" type="date" required>
          </label>
        </div>

        <label class="everyone-toggle">
          <input id="include-everyone" type="checkbox" checked>
          <span class="check-ui" aria-hidden="true"></span>
          <span><strong>Include @everyone</strong><small>Discord permissions determine who gets notified.</small></span>
        </label>

        <div class="row-labels" aria-hidden="true">
          <span>Event</span><span>UTC start</span><span>Bold</span><span></span>
        </div>
        <div id="schedule-rows" class="schedule-rows"></div>

        <div class="row-footer">
          <button type="button" id="add-row" class="button add-button"><span aria-hidden="true">＋</span> Add event</button>
          <label class="field end-field">
            <span>Optional end time (UTC)</span>
            <input id="end-time" type="time">
          </label>
        </div>

        <div id="warnings" class="warnings" role="status" aria-live="polite" hidden></div>
      </section>

      <section class="output-column" aria-label="Generated schedule">
        <div class="panel preview-panel">
          <div class="section-heading">
            <div>
              <p class="step">02 / CHECK</p>
              <h2>UTC rundown</h2>
            </div>
            <span id="event-count" class="count-chip">0 events</span>
          </div>
          <div id="friendly-preview" class="friendly-preview"></div>
        </div>

        <div class="panel message-panel">
          <div class="section-heading">
            <div>
              <p class="step">03 / SEND</p>
              <h2>Discord message</h2>
            </div>
            <span id="character-count" class="character-count">0 / 2,000</span>
          </div>
          <pre id="raw-message" tabindex="0" aria-label="Raw Discord message"></pre>
          <div class="send-actions">
            <button type="button" id="copy-message" class="button primary">Copy message</button>
            <button type="button" id="post-discord" class="button discord" disabled>Post to Discord</button>
          </div>
          <p id="webhook-status" class="webhook-status">Checking server posting…</p>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <template id="row-template">
      <div class="schedule-row">
        <div class="field row-name">
          <span class="mobile-label">Event name</span>
          <div class="event-name-controls">
            <input class="event-name" maxlength="100" autocomplete="off" aria-label="Event name">
            <select class="previous-event-names" aria-label="Previously entered event names">
              <option value="">Previous names</option>
            </select>
          </div>
        </div>
        <label class="field row-time">
          <span class="mobile-label">UTC start</span>
          <input class="event-time" type="time">
        </label>
        <label class="bold-toggle" title="Bold this line">
          <input class="event-bold" type="checkbox">
          <span class="check-ui" aria-hidden="true"></span>
          <span class="sr-only">Bold event</span>
        </label>
        <button type="button" class="delete-row" aria-label="Delete event">×</button>
      </div>
    </template>
    <script type="module" src="./app.js"></script>
  </body>
</html>
